version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify console env vars are NOT available to the Next.js server runtime
        # by default, so write the SMTP ones into .env.production at build time.
        - env | grep -E '^(SMTP_|CONTACT_RECEIVER)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
